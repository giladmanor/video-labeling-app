[project]
name = "video-label"
version = "0.1.0"
description = "Local macOS app to pre-label video events with Grok and confirm the labels by hand"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "keyring>=25",
  "static-ffmpeg>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
video-label = "video_label.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_label*"]

[tool.setuptools.package-data]
video_label = ["prompts/*.txt", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
